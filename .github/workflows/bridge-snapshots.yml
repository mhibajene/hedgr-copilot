name: Bridge snapshot freshness

on:
  pull_request:
    paths:
      - "docs/ops/reviews/weekly/**"
      - "docs/ops/reviews/MVP/**"
      - "docs/ops/bridge/**"
      - "scripts/bridge/**"
      - "scripts/rap/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/bridge-snapshots.yml"

jobs:
  bridge-snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack & install pinned pnpm
        run: |
          corepack enable
          corepack install
          node -v
          pnpm -v

      - name: Compute pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies (frozen)
        run: pnpm -r install --frozen-lockfile

      - name: Check bridge snapshot freshness and guardrails
        run: pnpm bridge:snapshots:check
