name: validate
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_AUTH_MODE: mock
      NEXT_PUBLIC_DEFI_MODE: mock
      NEXT_PUBLIC_FX_MODE: fixed
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CI-EFF-001 gitleaks scan
        continue-on-error: true
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d)
          trap 'result=$?; printf "Gitleaks report-only diagnostic exit: %s\n" "$result" >> "$GITHUB_STEP_SUMMARY"; rm -rf "$scan_dir"' EXIT
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          archive="$scan_dir/gitleaks_8.30.0_linux_x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            --output "$archive"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$scan_dir" gitleaks
          git rev-parse --verify --end-of-options "${PR_BASE}^{commit}"
          git rev-parse --verify --end-of-options "${PR_HEAD}^{commit}"
          merge_base=$(git merge-base "$PR_BASE" "$PR_HEAD")
          test -n "$merge_base"
          "$scan_dir/gitleaks" git --no-banner --redact=100 \
            --log-opts="$merge_base..$PR_HEAD" .

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack & install pinned pnpm
        run: |
          corepack enable
          corepack install
          node -v
          pnpm -v

      - name: Compute pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies (frozen)
        run: pnpm -r install --frozen-lockfile

      - name: CI-EFF-001 hermetic tests
        run: |
          bash .github/scripts/ci-eff-001-docs-only.test.sh
          node --test .github/scripts/ci-eff-001-verifier-condition.test.mjs

      - name: SEC-DEPS-001 dependency audit
        run: pnpm audit --audit-level=high --prod

      - name: Trust check (environment safety)
        run: pnpm -w trust:check

      - name: Trust phrase check (banned copy)
        run: pnpm -w trust:phrases

      - name: Guard route conflicts
        run: node scripts/ci/guard-route-conflicts.mjs

      - name: Typecheck (workspace)
        run: pnpm -w typecheck

      - name: Lint (workspace)
        run: pnpm -w lint

      - name: Unit tests
        run: pnpm -w test
