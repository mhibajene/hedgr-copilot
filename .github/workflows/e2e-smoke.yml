name: E2E smoke (@hedgr/frontend)
on:
  pull_request:

# allow the workflow to write commit statuses
permissions:
  contents: read
  statuses: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_AUTH_MODE: mock
      NEXT_PUBLIC_DEFI_MODE: mock
      NEXT_PUBLIC_FX_MODE: fixed
      NEXT_PUBLIC_APP_ENV: dev
      BACKEND_PORT: "5050"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5050
      OPENAI_MODE: stub
      CI: true
      # Hermetic guard (OPS-E2E-FONT-LOCAL-001): any next/font/google call fails the build instead of fetching Google (vercel/next.js#99114).
      NEXT_FONT_GOOGLE_MOCKED_RESPONSES: /nonexistent-hermetic-guard-no-google-fonts.js
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # bridge: mark required context as pending at start
      - name: Publish pending commit status (start)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'pending',
              context: 'E2E smoke (@hedgr/frontend)',
              description: 'E2E job started',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Classify PR changes
        id: classify
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! bash .github/scripts/ci-eff-001-docs-only.sh "$PR_BASE" "$PR_HEAD" >> "$GITHUB_OUTPUT"; then
            echo 'Classifier failed; selecting full E2E.' >&2
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack & install pinned pnpm
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: |
          corepack enable
          corepack install
          node -v
          pnpm -v

      - name: Compute pnpm store path
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies (frozen)
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: pnpm -r install --frozen-lockfile

      - name: Build frontend
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: pnpm --filter @hedgr/frontend run build
        env:
          NEXT_PUBLIC_FX_MODE: stub
          NEXT_PUBLIC_API_BASE_URL: http://localhost:${{ env.BACKEND_PORT }}

      - name: Setup Python
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend (editable, with test extras)
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/backend[test]"

      - name: Resolve Playwright version
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        id: playwright_version
        run: |
          version=$(node -p "require('./apps/frontend/node_modules/@playwright/test/package.json').version")
          test "$version" = '1.55.1'
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        id: playwright_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright system dependencies
        if: ${{ steps.classify.outputs.docs_only != 'true' && steps.playwright_cache.outputs.cache-hit == 'true' }}
        run: pnpm --filter @hedgr/frontend exec playwright install-deps chromium

      - name: Install Playwright
        if: ${{ steps.classify.outputs.docs_only != 'true' && steps.playwright_cache.outputs.cache-hit != 'true' }}
        run: pnpm --filter @hedgr/frontend exec playwright install --with-deps chromium

      - name: Start stub backend (STUB_MODE)
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: |
          set -euo pipefail
          : > apps/backend/backend.log
          nohup python -m src.app --port "${BACKEND_PORT}" \
            > apps/backend/backend.log 2>&1 &
          echo $! > apps/backend/backend.pid
        env:
          STUB_MODE: "true"
          PORT: ${{ env.BACKEND_PORT }}
          PYTHONUNBUFFERED: "1"

      - name: Wait for backend readiness (/v1/health)
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: |
          set -euo pipefail
          url="http://localhost:${BACKEND_PORT}/v1/health"
          echo "Polling: $url"
          for i in {1..45}; do
            if curl -fsS "$url" >/dev/null; then
              echo "Backend ready"
              exit 0
            fi
            echo "Not ready yet ($i/45)..." && sleep 1
          done
          echo "Backend failed to become ready in time"
          echo "---- backend.log (tail) ----"
          tail -n 200 apps/backend/backend.log || true
          exit 1

      - name: Run E2E tests
        if: ${{ steps.classify.outputs.docs_only != 'true' }}
        run: pnpm --filter @hedgr/frontend run e2e:ci
        env:
          NEXT_PUBLIC_FX_MODE: stub
          NEXT_PUBLIC_API_BASE_URL: http://localhost:${{ env.BACKEND_PORT }}

      - name: Upload backend logs (on failure)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-log
          path: apps/backend/backend.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report E2E status (docs-only)
        if: ${{ success() && steps.classify.outputs.docs_only == 'true' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'E2E smoke (@hedgr/frontend)',
              description: 'SKIPPED (docs-only, E2E not executed) CI-EFF-001',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      # bridge: set required context to success/failure to satisfy branch protection
      - name: Report E2E status (success)
        if: ${{ success() && steps.classify.outputs.docs_only != 'true' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'E2E smoke (@hedgr/frontend)',
              description: 'Playwright E2E passed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Report E2E status (failure)
        if: ${{ failure() || cancelled() }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'failure',
              context: 'E2E smoke (@hedgr/frontend)',
              description: 'Playwright E2E failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });