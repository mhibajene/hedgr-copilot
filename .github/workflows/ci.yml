name: CI
on:
  push:
    branches:
      - main
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Fork-safe checks (typecheck/lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Use repo's Node (from .nvmrc) if present.
      - name: Setup Node from .nvmrc (if present)
        if: ${{ hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          # NOTE: no cache here; pnpm not installed yet

      # Install/activate repo-pinned pnpm via Corepack
      - name: Enable Corepack and install pinned pnpm
        run: |
          corepack enable
          corepack install
          node -v
          pnpm -v

      # Cache pnpm store (keyed by lockfile)
      - name: Compute pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies (frozen)
        run: pnpm -r install --frozen-lockfile

      - name: Guard versions (no "latest" or "*")
        run: pnpm run ci:guard:versions

      - name: Typecheck (workspace)
        run: pnpm -w typecheck

      - name: Lint (workspace)
        run: pnpm -w lint

  build:
    runs-on: ubuntu-latest
    env:
      DOPPLER_TOKEN: ${{ github.event_name == 'pull_request' && secrets.DOPPLER_TOKEN_DEV || secrets.DOPPLER_TOKEN_STG }}
      DOPPLER_CONFIG: ${{ github.event_name == 'pull_request' && 'dev_config_dev' || 'stg_config_stg' }}
      # CI-safe defaults for when Doppler is skipped (forked PRs) or missing vars
      NEXT_PUBLIC_APP_ENV: dev
      # API_BASE_URL is validated at runtime when used, not at build time

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch secrets from Doppler
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: dopplerhq/secrets-fetch-action@cd2efbf9a404504316435873eff298b82f7e0562 # v1.3.0
        with:
          auth-method: token
          doppler-token: ${{ env.DOPPLER_TOKEN }}
          doppler-project: hedgr-copilot
          doppler-config: ${{ env.DOPPLER_CONFIG }}
          inject-env-vars: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Install
        run: pnpm -r install --frozen-lockfile

      - name: Validate frontend env
        run: pnpm run validate:env:frontend

      - name: Build
        run: pnpm -w build

      - name: Test
        run: pnpm -w test